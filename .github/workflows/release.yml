name: Release Build

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a pre-release (offered only on the beta update channel)'
        type: boolean
        default: false
      publish:
        description: 'Publish a GitHub Release (untick to only build)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Restore Signing Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE secret is not set; release builds must be signed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 --decode > TMessagesProj/release.keystore
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease
      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release-arm64-v8a
          path: TMessagesProj/build/outputs/apk/release/*-arm64-v8a.apk
      - name: Upload universal Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release-universal
          path: TMessagesProj/build/outputs/apk/release/*-universal.apk
  publish:
    name: Publish GitHub Release
    if: inputs.publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION_NAME=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^def verCode = \([0-9]*\).*/\1/p' TMessagesProj/build.gradle)
          # The in-app updater parses the version code from the tag suffix.
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump verCode in TMessagesProj/build.gradle."
            exit 1
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" artifacts/*/*.apk \
            --target "$GITHUB_SHA" \
            --title "NagramXX ${VERSION_NAME} (${VERSION_CODE})" \
            --generate-notes \
            "${FLAGS[@]}"
